[project]
name = "golden-analytics-backend"
version = "0.1.0"
description = "Backend for the data cleaning and answer comparison app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
